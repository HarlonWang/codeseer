name = "codeseer"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

[vars]
GITHUB_APP_ID = "4845701"
OPENAI_MODEL = "gpt-5.6-terra"
OPENAI_REASONING_EFFORT = "medium"
MAX_FILE_DIFF_LINES = "2000"
MAX_TOTAL_DIFF_CHARS = "480000"

[[kv_namespaces]]
binding = "STATE"
id = "bb3cbb2f1d32421c9c6f00e01eb8be9d"

[[queues.producers]]
binding = "REVIEW_QUEUE"
queue = "codeseer-review"

[[queues.consumers]]
queue = "codeseer-review"
max_batch_size = 1
max_retries = 2
max_concurrency = 1
dead_letter_queue = "codeseer-review-dlq"
